# Prometheus 配置文件 — We_Listen 智能客服系统

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'we_listen'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # We_Listen 主应用指标
  - job_name: 'we_listen-app'
    static_configs:
      - targets: ['we_listen:8000']
        labels:
          service: 'we_listen'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
